    <circle cx="23.4" cy="7.6" r="1.85"/>
    <circle cx="8.2" cy="27.3" r="1.85"/>
    <circle cx="56.7" cy="43.6" r="1.85"/>
    <circle cx="41.6" cy="53.3" r="1.85"/>
    <!-- letras IA dentro del chip -->
    <rect x="23.28" y="24.72" width="2.65" height="15.04"/>
    <path fill-rule="evenodd" d="M32.85 24.72H35.65L40.6 39.76H38.1L37.09 36.69H31.41L30.4 39.76H27.9ZM34.25 28.06 36.45 34.75H32.05Z"/>
