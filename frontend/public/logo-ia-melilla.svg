<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 64" role="img" aria-label="IA Melilla">
  <title>IA Melilla</title>
  <!--
    Logotipo de IA Melilla redibujado en vectorial a partir del original de Joaquin Gorge
    (_joaquin/logoyfavicon/Ia Melilla.png). Sin el fondo gris del original: fondo transparente.
    Color #0DBFDE, muestreado del trazo del PNG por debajo del halo de neon.
    El texto va como <path>: contornos de Inter (la tipografia del sitio, que coincide con la
    del original) convertidos a curvas, para que no dependa de fuentes del visitante.
    "IA" en Inter 700, "MELILLA" en Inter 500, ambas a tracking 0.
  -->
  <g fill="none" stroke="#0DBFDE" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <!-- cuerpo del chip -->
    <rect x="17.85" y="17.85" width="28.3" height="28.3" rx="3.3"/>
    <!-- pistas: traza en L superior, y los pines rectos de los cuatro lados -->
    <path d="M32.2 5.9V13.3H43.6"/>
    <path d="M23.4 7.6V14.3M8.2 27.3H14.3M8.6 35.2H14.3M49.7 27.6H55.1M31.9 49.7V57.3"/>
    <path d="M49.7 35.3H55.2Q56.7 35.3 56.7 36.8V43.6"/>
    <path d="M39.2 49.7V51.8Q39.2 53.3 40.7 53.3H41.6"/>
    <path d="M24.9 49.7V53.9L22.1 57.2"/>
    <!-- pines diagonales de las cuatro esquinas -->
    <path d="M12.9 12.9 16.3 16.3M51.1 12.9 47.7 16.3M12.9 51.1 16.3 47.7M51.1 51.1 47.7 47.7"/>
    <!-- terminaciones en anillo -->
    <circle cx="32.2" cy="4" r="1.9"/>
    <circle cx="11.4" cy="11.4" r="1.9"/>
    <circle cx="52.6" cy="11.4" r="1.9"/>
    <circle cx="6.7" cy="35.2" r="1.9"/>
    <circle cx="57" cy="27.6" r="1.9"/>
    <circle cx="11.4" cy="52.6" r="1.9"/>
    <circle cx="52.6" cy="52.6" r="1.9"/>
    <circle cx="31.9" cy="59.2" r="1.9"/>
  </g>
  <g fill="#0DBFDE">
