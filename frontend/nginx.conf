# Área de clientes fuera del índice.
#
# No está en el sitemap, pero el menú enlaza "Acceso clientes" a /cliente/login,
# así que los rastreadores llegan igual. Va por cabecera y no con una meta en
# React porque el rastreador que no ejecuta JavaScript —con una SPA, casi todos
# menos Google— nunca vería la meta.
#
# Se resuelve con un map y no con un location propio porque el fallback de la
# SPA (try_files ... /index.html) es una redirección interna: nginx vuelve a
# elegir location, cae en "location /" y descarta los add_header del bloque de
# origen. La cabecera se perdía sin dar ningún aviso. $request_uri conserva la
# ruta que pidió el cliente; $uri ya valdría /index.html a esas alturas.
#
# nginx omite el header cuando el valor evalúa a cadena vacía, así que el resto
# del sitio no lo lleva.
#
# La regexp va sin distinguir mayúsculas (~*) por si alguien enlaza /Cliente.
# Lo que NO cubre es el porcentaje-codificado (/%63liente): $request_uri es el
# URI en crudo y no lo descodifica. Se asume: nadie enlaza así y los buscadores
# normalizan el porcentaje-codificado de los caracteres no reservados antes de
# pedir la URL (RFC 3986). Además, esa ruta acabaría renderizando el área de
# cliente en React, que exige sesión, y si no la hay se ve el login.
map $request_uri $robots_tag {
	default "";
	~*^/cliente(/|\?|$) "noindex, nofollow";
}

server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Todo lo que servimos es UTF-8. Sin esto, text/plain viaja sin charset y
	# quien lo lea puede asumir ISO-8859-1: llms.txt está lleno de tildes y de
	# eñes, y saldría descuadrado. El HTML no lo necesitaba (lo declara su
	# <meta charset>) pero tampoco le hace daño.
	charset utf-8;

	# Long-cache for hashed assets
	location ~* \.(?:css|js|woff2?|svg|jpg|jpeg|png|webp|gif|ico)$ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		access_log off;
		try_files $uri =404;
		# Repetidas: este bloque tiene add_header propio y no hereda del server.
		# El nosniff importa aquí más que en ningún sitio: cubre todo el JS y CSS.
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	}

	# Admin (Sveltia CMS) — sirve siempre admin/index.html, no usa SPA fallback
	location /admin/ {
		try_files $uri $uri/ /admin/index.html;
		add_header X-Robots-Tag "noindex, nofollow" always;
		# Sin caché: el HTML fija la versión de Sveltia CMS que se carga del CDN.
		# Cacheado, un editor seguiría con la versión anterior tras el despliegue.
		add_header Cache-Control "no-cache, must-revalidate";
		# Repetidas a propósito: un add_header dentro de un location anula los
		# heredados del server, y el panel es donde más falta hacen.
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	}

	# Admin config.yml — sin cache para que cambios de schema se vean al instante
	location = /admin/config.yml {
		add_header Cache-Control "no-cache, must-revalidate";
		add_header X-Robots-Tag "noindex, nofollow" always;
		# Mismo motivo que arriba: este bloque tampoco hereda del server.
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	}

	# SPA fallback
	location / {
		try_files $uri $uri/ /index.html;
		# Vacío salvo bajo /cliente (ver el map de arriba); nginx no añade la
		# cabecera cuando el valor es una cadena vacía.
		add_header X-Robots-Tag $robots_tag always;
		# Repetidas OBLIGATORIAMENTE: en cuanto este bloque tiene un add_header
		# propio deja de heredar los del server, y sin estas tres líneas todas
		# las páginas HTML del sitio se quedarían sin cabeceras de seguridad.
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	}

	# Sitemap, robots y llms.txt — no cache.
	# El =404 es deliberado: si el fichero no está en el build, estas rutas
	# deben fallar, no caer en el fallback de la SPA. Servir el index.html
	# como si fuera el sitemap devuelve HTML con 200 y los rastreadores lo
	# dan por bueno; mejor un 404 honesto que se ve en los logs.
	location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
		try_files $uri =404;
		add_header Cache-Control "no-cache, must-revalidate";
		# Repetidas por el mismo motivo: add_header propio, sin herencia.
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	}

	# Gzip
	gzip on;
	gzip_vary on;
	gzip_min_length 256;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml text/xml application/xml;

	# Security headers
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
