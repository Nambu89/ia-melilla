server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Long-cache for hashed assets
	location ~* \.(?:css|js|woff2?|svg|jpg|jpeg|png|webp|gif|ico)$ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		access_log off;
		try_files $uri =404;
		# Repetidas: este bloque tiene add_header propio y no hereda del server.
		# El nosniff importa aquí más que en ningún sitio: cubre todo el JS y CSS.
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	}

	# Admin (Sveltia CMS) — sirve siempre admin/index.html, no usa SPA fallback
	location /admin/ {
		try_files $uri $uri/ /admin/index.html;
		add_header X-Robots-Tag "noindex, nofollow" always;
		# Sin caché: el HTML fija la versión de Sveltia CMS que se carga del CDN.
		# Cacheado, un editor seguiría con la versión anterior tras el despliegue.
		add_header Cache-Control "no-cache, must-revalidate";
		# Repetidas a propósito: un add_header dentro de un location anula los
		# heredados del server, y el panel es donde más falta hacen.
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	}

	# Admin config.yml — sin cache para que cambios de schema se vean al instante
	location = /admin/config.yml {
		add_header Cache-Control "no-cache, must-revalidate";
		# Mismo motivo que arriba: este bloque tampoco hereda del server.
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	}

	# SPA fallback
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Sitemap & robots — no cache
	location ~ ^/(robots\.txt|sitemap\.xml)$ {
		add_header Cache-Control "no-cache, must-revalidate";
		# Repetidas por el mismo motivo: add_header propio, sin herencia.
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	}

	# Gzip
	gzip on;
	gzip_vary on;
	gzip_min_length 256;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml;

	# Security headers
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
